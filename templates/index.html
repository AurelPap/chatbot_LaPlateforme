<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT-3 Prompt Interface</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <img src="/static/logo.png" alt="Logo de La Plateforme" id="logo">
        <div>
            <h1>La Plateforme</h1>
            <h3>La grande école du numérique pour tous</h3>
        </div>
    </header>
    <main>
        <div id="history">Aucun historique disponible.</div>
        <div class="input-area">
            <textarea id="prompt" placeholder="Écrivez votre prompt ici..." onkeydown="checkForEnter(event)"></textarea>
            <button onclick="sendPrompt()">Envoyer</button>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 La Plateforme. Tous droits réservés.</p>
    </footer>

    <script>
        function checkForEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendPrompt();
            }
        }

        async function sendPrompt() {
            const prompt = document.getElementById('prompt').value;
            
            // Vérifier si le prompt n'est pas vide
            if (prompt.trim() === "") {
                alert("Veuillez entrer un prompt.");
                return;
            }

            const response = await fetch('/send_prompt', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ prompt })
            });

            const result = await response.json();

            // Vider l'aire de texte après l'envoi du prompt
            document.getElementById('prompt').value = "";

            // Mettre à jour l'historique
            await fetchHistory();
        }

        async function fetchHistory() {
            const historyDiv = document.getElementById('history');
            const response = await fetch('/get_history');
            const history = await response.json();
            
            if (history.length === 0) {
                historyDiv.innerHTML = 'Aucun historique disponible.';
            } else {
                historyDiv.innerHTML = '';
                history.forEach(entry => {
                    const entryDiv = document.createElement('div');
                    entryDiv.innerHTML = `<strong>Vous:</strong> ${entry.prompt}<br><strong>GPT-3:</strong> ${entry.response}`;
                    historyDiv.appendChild(entryDiv);
                });
            }

            // Scroll vers le bas
            historyDiv.scrollTop = historyDiv.scrollHeight;
        }

        // Charger l'historique au chargement de la page
        window.onload = fetchHistory;
    </script>
</body>
</html>
